# Full stack, for testing on a LAN or running on the mini PC.
#
# The app publishes a port here so it can be reached from a phone on the same
# network. Behind Cloudflare Tunnel that mapping comes out and the tunnel
# container joins this network instead -- at which point nothing but the tunnel
# can reach the app at all.
#
#   docker compose -f docker-compose.app.yml up -d --build
#   open http://<this machine's LAN address>:3000
#
# A distinct project name, so this stack does not adopt the development
# database container from docker-compose.yml. It did: same directory, same
# default project, same service name -- and recreating it here without the
# published port left every local database test unable to connect.
name: scopeline

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_dev_only}
      POSTGRES_DB: quote
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quote']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quote:${POSTGRES_PASSWORD:-quote_dev_only}@db:5432/quote
      # Chromium fetches the print page from inside this container. The public
      # hostname would resolve to Cloudflare and authenticate against Access
      # instead of the render secret.
      INTERNAL_BASE_URL: http://127.0.0.1:3000
      INTERNAL_RENDER_SECRET: ${INTERNAL_RENDER_SECRET:?set INTERNAL_RENDER_SECRET in .env}
      # LAN testing mode. Swap to Access by removing these two and setting
      # CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD -- access.ts refuses to run
      # both at once, so a half-configured tunnel cannot fall back to trusting
      # everyone.
      AUTH_MODE: ${AUTH_MODE:-local}
      # Must match a users row: authorization is a lookup against users, and
      # local mode is not exempt. The demo seed creates this address.
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-owner@northgate.example}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Loads the fictional demo tenant on first boot so there is something to
      # click. Set to 0 before a real company's data goes in.
      SEED_DEMO: ${SEED_DEMO:-1}

      # Backup. The recipient is a PUBLIC age key: this machine writes backups
      # it cannot itself read, so a stolen mini PC yields no data. Unset means
      # no backups are taken at all, and the boot says so out loud.
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      # Bind-mounted below at the same path, because a path that exists inside
      # the container but is not a mount lands on the container filesystem and
      # fills the disk holding the database. backup.sh verifies the mount and a
      # sentinel file before every write for exactly that reason.
      BACKUP_USB_DIR: ${BACKUP_USB_DIR:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - files:/data/files
      - backups:/data/backups
      # The USB drive, at the same path BACKUP_USB_DIR names. Commented out
      # rather than guessed: an unset host path silently becomes an anonymous
      # volume, which is a backup destination on the same disk as the database
      # and defeats the point of having one.
      # - /mnt/backup:/mnt/backup
    restart: unless-stopped

volumes:
  dbdata:
  files:
  backups:
