# Full stack, for testing on a LAN or running on the mini PC.
#
# The app publishes a port here so it can be reached from a phone on the same
# network. Behind Cloudflare Tunnel that mapping comes out and the tunnel
# container joins this network instead -- at which point nothing but the tunnel
# can reach the app at all.
#
#   docker compose -f docker-compose.app.yml up -d --build
#   open http://<this machine's LAN address>:3000
#
# A distinct project name, so this stack does not adopt the development
# database container from docker-compose.yml. It did: same directory, same
# default project, same service name -- and recreating it here without the
# published port left every local database test unable to connect.
name: jobbook

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_dev_only}
      POSTGRES_DB: quote
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quote']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quote:${POSTGRES_PASSWORD:-quote_dev_only}@db:5432/quote
      # Chromium fetches the print page from inside this container. The public
      # hostname would resolve to Cloudflare and authenticate against Access
      # instead of the render secret.
      INTERNAL_BASE_URL: http://127.0.0.1:3000
      DEPLOY_CONFIG_PATH: /data/config/auth.env
      INTERNAL_RENDER_SECRET: ${INTERNAL_RENDER_SECRET:?set INTERNAL_RENDER_SECRET in .env}
      # LAN testing mode. Swap to Access by removing these two and setting
      # CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD -- access.ts refuses to run
      # both at once, so a half-configured tunnel cannot fall back to trusting
      # everyone.
      AUTH_MODE: ${AUTH_MODE:-local}
      # Must match a users row: authorization is a lookup against users, and
      # local mode is not exempt. The demo seed creates this address.
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-owner@northgate.example}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Loads the fictional demo tenant on first boot so there is something to
      # click. Set to 0 before a real company's data goes in.
      SEED_DEMO: ${SEED_DEMO:-1}

      # Backup. The recipient is a PUBLIC age key: this machine writes backups
      # it cannot itself read, so a stolen mini PC yields no data. Unset means
      # no backups are taken at all, and the boot says so out loud.
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      # Bind-mounted below at the same path, because a path that exists inside
      # the container but is not a mount lands on the container filesystem and
      # fills the disk holding the database. backup.sh verifies the mount and a
      # sentinel file before every write for exactly that reason.
      BACKUP_USB_DIR: ${BACKUP_USB_DIR:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    ports:
      # Bound to LOOPBACK by default, not to every interface. Reaching the app
      # from another machine is then a deliberate act: either through the proxy
      # (HTTPS) or the tunnel, both below, or by setting APP_BIND=0.0.0.0 and
      # accepting plain HTTP across the office network.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - files:/data/files
      - backups:/data/backups
      # Where the setup wizard writes the deployment configuration. A file
      # rather than database rows, because these are credentials and a database
      # row is mirrored to SharePoint and lands in every backup.
      - config:/data/config
      # The USB drive, at the same path BACKUP_USB_DIR names. Commented out
      # rather than guessed: an unset host path silently becomes an anonymous
      # volume, which is a backup destination on the same disk as the database
      # and defeats the point of having one.
      # - /mnt/backup:/mnt/backup
    restart: unless-stopped

  # The backup schedule, in its own container.
  #
  # Same image, so it carries the same pg_dump, age and scripts, and updates
  # with the app rather than drifting a major version behind it. Separate
  # process, so a dump cannot slow the web server and a failing backup cannot
  # take the quoting system down with it.
  #
  # It refuses to start without a recipient key rather than idling: a container
  # named `backup` that is quietly taking none looks exactly like one that is
  # working.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/usr/local/bin/backup-loop.sh']
    # The image's healthcheck pings the web server's /api/health. This
    # container runs no web server, so it would report unhealthy forever --
    # a permanent false alarm sitting next to the real signal, which is the
    # exact failure this tier's monitoring is meant to avoid. Liveness here is
    # the dump's own freshness, reported in the app from sync_state and the
    # artifact timestamps.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://quote:${POSTGRES_PASSWORD:-quote_dev_only}@db:5432/quote
      # Passed through rather than required here. A missing key must fail
      # LOUDLY AT RUNTIME -- backup-loop.sh exits with the reason and the
      # container shows as Exited(1) -- not at parse time, where it would stop
      # `docker compose up` bringing the quoting system up at all. A refusal to
      # start the app because backups are unconfigured is the wrong trade for a
      # contractor who needs to send a quote this afternoon.
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_USB_DIR: ${BACKUP_USB_DIR:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_RETAIN_HOURLY_HOURS: ${BACKUP_RETAIN_HOURLY_HOURS:-48}
      BACKUP_RETAIN_DAILY_DAYS: ${BACKUP_RETAIN_DAILY_DAYS:-30}
    # Reads the deployment configuration READ-ONLY, because the setup screen
    # is what writes BACKUP_AGE_PUBLIC_KEY there and this container is its own
    # entrypoint -- without the mount it would never see a key the app had
    # just generated, and would exit saying no backups were possible while the
    # app showed them as configured. See docker/read-config.sh.
    volumes:
      # Reads the same uploaded files the app writes, and writes into the same
      # backup volume, so one artifact set exists rather than two.
      - files:/data/files:ro
      - backups:/data/backups
      - config:/data/config:ro
      # - /mnt/backup:/mnt/backup
    # on-failure, not unless-stopped: an unconfigured key is a permanent
    # condition, and a container that restarts forever on the same fatal
    # message buries it in a log nobody reads. Exited(1) beside a running app
    # is visible in one `docker compose ps`.
    restart: on-failure

  # The reminder schedule, in its own container.
  #
  # Same image and the same shape as `backup` above, for the same two reasons:
  # a slow evaluation cannot slow the web server, and a failing evaluation
  # cannot take the quoting system down with it. It carries the same code as
  # the app, so it can never be querying a schema a version behind.
  #
  # It waits for the APP rather than for the database, which the backup service
  # does not. The app is what applies migrations at boot, and an evaluation
  # against a database that does not yet have `reminders` in it would fail
  # every hour on a fresh deployment until somebody read the log.
  reminders:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ['/usr/local/bin/reminder-loop.sh']
    # The image's healthcheck pings the web server's /api/health, and this
    # container runs no web server -- it would report unhealthy forever, a
    # permanent false alarm sitting next to the real signal.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://quote:${POSTGRES_PASSWORD:-quote_dev_only}@db:5432/quote
      # Hourly. Lower it to watch the thing work on a new deployment; there is
      # no cost to running it more often, because an evaluation that finds
      # nothing new inserts nothing -- the unique partial index
      # `reminders_one_open_per_rule` is what makes that true rather than a
      # convention somebody has to keep.
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
    # unless-stopped, not on-failure: unlike the backup container there is
    # nothing to configure here and therefore no permanent fatal condition to
    # restart into. A failed evaluation is logged and the next hour tries
    # again, so the container should outlive a bad hour.
    restart: unless-stopped

  # HTTPS. Opt in with: docker compose --profile https up -d
  #
  # A real domain gets a public certificate automatically. A LAN address gets
  # one from Caddy's own internal CA, which browsers distrust until that CA is
  # installed on each device -- the honest cost of HTTPS with no domain and no
  # internet, and cheaper than the alternative of a business quoting over
  # plain HTTP across a shared office network.
  proxy:
    image: caddy:2-alpine
    profiles: ['https']
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      CADDY_SITE: ${CADDY_SITE:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      # Unset for a LAN address on purpose: pinning a browser to HTTPS for a
      # bare IP is not something an owner can undo without clearing state on
      # every device.
      CADDY_HSTS: ${CADDY_HSTS:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

  # Cloudflare Tunnel. Opt in with: docker compose --profile tunnel up -d
  #
  # With this running, nothing needs to be published at all: cloudflared makes
  # an outbound connection and Cloudflare terminates TLS at its edge, so there
  # is no inbound port, no certificate to renew, and no router to configure.
  # Access policies in front of it are what make AUTH_MODE=access meaningful.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    depends_on:
      app:
        condition: service_healthy
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      # From the Cloudflare dashboard when the tunnel is created. It is a
      # credential: it belongs in .env or the wizard's config file, never in a
      # committed compose file.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  dbdata:
  files:
  backups:
  config:
  caddydata:
  caddyconfig:
