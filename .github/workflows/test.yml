name: test

# `workflow_call` as well as the ordinary triggers, so `release.yml` can make
# publishing an image depend on this passing rather than merely running
# beside it. A tag push starts both workflows; without the dependency the
# image can reach the registry while the suite is still going, and a red
# build after a green publish is worth nothing.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quote
          POSTGRES_PASSWORD: quote_dev_only
          POSTGRES_DB: quote
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U quote"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://quote:quote_dev_only@127.0.0.1:5433/quote
      TEST_DATABASE_URL: postgres://quote:quote_dev_only@127.0.0.1:5433/quote_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ----------------------------------------------------------------------
      # The browser, without which the PDF suite cannot run
      # ----------------------------------------------------------------------
      #
      # `lib/documents/pdf.ts` drives real Chromium, because the quote a
      # customer signs is rendered by the same engine that renders it on
      # screen. Playwright refuses to drive a build it did not ship with, so
      # the browser has to be the one THIS version downloads -- which is why
      # the version is read out of the lockfile rather than written here, and
      # why the Dockerfile pins its base image to the same number.
      #
      # This step was missing, and the suite passed anyway on any machine that
      # had run `npx playwright install` once. CI is the machine that never
      # has: the first run failed with "Executable doesn't exist at
      # .../chrome-headless-shell", which reads as a broken Playwright install
      # rather than a missing setup step. The root README states the
      # requirement; the workflow did not honour it.
      - name: Read the locked Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on the browser version, not on the whole lockfile: an unrelated
      # dependency bump should not re-download 150MB of Chromium.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` every run, cache hit or not. The cache holds the browser
      # but not the apt packages it links against, and a restored browser that
      # cannot find a shared library fails at launch with a message about the
      # executable rather than about the library. `install` skips the download
      # when the browser is already there, so a hit costs only the apt step.
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      # The suite connects to TEST_DATABASE_URL, so that database has to exist
      # and carry the schema. Migrating only DATABASE_URL would leave every
      # database test failing on a missing table.
      - name: Create the test database
        run: PGPASSWORD=quote_dev_only psql -h 127.0.0.1 -p 5433 -U quote -d quote -c 'create database quote_test'

      # drizzle-kit migrate, not push: push diffs a schema and would skip the
      # custom migrations that carry the triggers and the no-DELETE grant.
      - name: Migrate both databases
        run: |
          npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npx drizzle-kit migrate

      - run: npm run typecheck
      - run: npm test
